<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src https://api.open-meteo.com https://geocoding-api.open-meteo.com https://ipwho.is; form-action 'none'; base-uri 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daybook</title>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/widget.css">
</head>
<body class="widget-body">

  <div class="wg">

    <!-- The one line of chrome there is. The buttons sit here but stay
         invisible until the pointer is over the widget: a desktop widget
         is something you glance at, and controls you never use should
         not be part of the picture. -->
    <div class="wg__bar">
      <p class="wg__meta">
        <span id="wg-date"></span><span class="wg__weather" id="weather"></span>
      </p>
      <!-- Only there when a newer version is out. Unlike the other
           buttons it does not wait for the pointer: it is news. -->
      <button class="wg__upd" type="button" id="wg-update" hidden></button>
      <div class="wg__tools">
        <button class="wg__btn" type="button" id="wg-top" title="Keep above other windows">&#9650;</button>
        <button class="wg__btn" type="button" id="wg-open" title="Open the full panel">&#10530;</button>
        <button class="wg__btn" type="button" id="wg-hide" title="Hide (Ctrl+Shift+D brings it back)">&#215;</button>
      </div>
    </div>

    <div class="wg__hero">
      <div class="wg__top">
        <div class="wg__topmain">
          <p class="wg__eyebrow" id="wg-streak-label">Streak</p>
          <p class="wg__streak" id="wg-streak">&nbsp;</p>
          <p class="wg__chip" id="wg-done" hidden></p>
        </div>
        <div class="ring" id="wg-ring" style="--p: 0">
          <span class="ring__inner" id="wg-ring-text">0<i>%</i></span>
        </div>
      </div>

      <div class="wg__week" id="wg-week"></div>
    </div>

    <div class="wg__habits" id="wg-habits"></div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/presets.js"></script>
  <script src="js/habits.js"></script>
  <script src="js/weather.js"></script>
  <script src="js/update-ui.js"></script>
  <script src="js/widget.js"></script>
</body>
</html>
