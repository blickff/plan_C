<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src https://api.open-meteo.com https://geocoding-api.open-meteo.com https://ipwho.is; form-action 'none'; base-uri 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daybook</title>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/widget.css">
</head>
<body class="widget-body">

  <!-- The whole widget. Which face it wears — Clock, Today, Week, Plans,
       Note or Money — and how, is chosen in the panel under Settings →
       Desktop widget; js/widget.js draws it. -->
  <div class="wg" id="wg">

    <!-- The one line of chrome there is: the date, the weather, and a few
         buttons that only appear under the pointer. Pinned to the desktop,
         only "open the panel" is left — a pinned widget is not moved,
         hidden or closed from itself, only unpinned in Settings. -->
    <div class="wg__bar">
      <p class="wg__meta"><span id="wg-date"></span><span class="wg__weather" id="weather"></span></p>
      <!-- Only there when a newer version is out. Unlike the other
           buttons it does not wait for the pointer: it is news. -->
      <button class="wg__upd" type="button" id="wg-update" hidden></button>
      <div class="wg__tools">
        <button class="wg__btn wg__unpinned" type="button" id="wg-pin" title="Pin to the desktop — it stays put until unpinned in Settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4h6l-1 5 3 3v2H7v-2l3-3-1-5z"/><path d="M12 14v6"/></svg>
        </button>
        <button class="wg__btn wg__unpinned" type="button" id="wg-top" title="Keep above other windows">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 14l6-6 6 6"/></svg>
        </button>
        <button class="wg__btn" type="button" id="wg-open" title="Open the full panel">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 5h5v5"/><path d="M19 5l-7 7"/><path d="M18 14v4a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h4"/></svg>
        </button>
        <button class="wg__btn wg__unpinned" type="button" id="wg-hide" title="Hide (Ctrl+Shift+D brings it back)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"/></svg>
        </button>
      </div>
    </div>

    <div class="wg__face" id="wg-face"></div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/motion.js"></script>
  <script src="js/presets.js"></script>
  <script src="js/habits.js"></script>
  <script src="js/weather.js"></script>
  <script src="js/update-ui.js"></script>
  <script src="js/widget.js"></script>
</body>
</html>
